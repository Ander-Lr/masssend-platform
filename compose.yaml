# MassSend — arquitectura distribuida completa en Docker Compose.
# Servicios independientes (NO monolito): cada uno con su imagen,
# su contenedor y comunicación por la red interna `masssend_network`.
#
#   Postman ─→ backend (Django:8000); el frontend entra en la fase siguiente
#   backend ─→ whatsapp (Node:3001), ollama (11434), pocketbase (8080)
#   whatsapp ─→ backend (webhooks autenticados) y pocketbase (archivos)
#   solo el backend publica su puerto en el host
#
# Perfiles:
#   real  sistema completo, con WhatsApp, Ollama, PocketBase y Gmail.
#   ci    API con adaptadores falsos y datos temporales, para Postman.
x-adaptadores-reales: &adaptadores-reales
  CANAL_MENSAJERIA: whatsapp
  COLA_ENVIOS: celery
  ALMACEN_ARCHIVOS: pocketbase
  GENERADOR_TEXTO: ollama
  PASARELA_PAGO_FAKE: "0"
  DESTINO_CORREO: gmail
  PROVEEDOR_GOOGLE: google

x-backend-ci: &backend-ci
  build:
    context: ./backend
  environment: &entorno-ci
    SECRET_KEY: "${SECRET_KEY:?Define SECRET_KEY en el archivo de --env-file}"
    JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Define JWT_SECRET_KEY en el archivo de --env-file}"
    DATABASE_URL: "postgres://masssend_ci:solo-pruebas@postgres-ci:5432/masssend_ci"
    DB_SSL_REQUIRE: "False"
    DEBUG: "False"
    REDIS_URL: "redis://redis:6379/0"
    CANAL_MENSAJERIA: fake
    COLA_ENVIOS: sincrona
    ALMACEN_ARCHIVOS: memoria
    GENERADOR_TEXTO: "${GENERADOR_TEXTO_CI:-fake}"
    OLLAMA_URL: "http://ollama-ci:11434"
    OLLAMA_MODEL: "${OLLAMA_MODEL_CI:-qwen2.5:0.5b}"
    PASARELA_PAGO_FAKE: "1"
    API_LIMITE_ASISTENTE: 100000/min
    DESTINO_CORREO: mailpit
    PROVEEDOR_GOOGLE: fake
    FREE_SIGNUP_CREDITS: "10"
    API_LIMITE_ANONIMO: 100000/min
    API_LIMITE_USUARIO: 100000/min
    API_LIMITE_SENSIBLE: 100000/min
    EMAIL_QUEUE_INTERVAL_MS: "200"
  networks:
    - masssend_network
  restart: unless-stopped

services:

  # ── Backend Django (API, autenticación, campañas, pagos) ──────────
  backend:
    profiles: [real]
    build:
      context: ./backend
    container_name: masssend-backend
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      # Dentro de la red Docker los servicios se llaman por su nombre
      WHATSAPP_API_URL: "http://whatsapp:3001"
      OLLAMA_URL: "http://ollama:11434"
      POCKETBASE_URL: "http://pocketbase:8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-masssend_user}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en backend/.env y usa --env-file backend/.env}@postgres:5432/${POSTGRES_DB:-masssend_db}"
      DB_SSL_REQUIRE: "False"
      DEBUG: "False"
      REDIS_URL: "redis://redis:6379/0"
      <<: *adaptadores-reales
    volumes:
      - ./backend/media:/app/media
    depends_on:
      - pocketbase
      - ollama
      - postgres
      - redis
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Worker: consumidor de la cola de correos (asíncrono) ───────────
  # Mismo código e imagen que "backend", pero corre otro comando:
  # en vez de servir HTTP, se queda en bucle revisando EmailTask
  # (PENDING -> PROCESSING -> SENT/FAILED). Es un servicio aparte para
  # que un correo lento (SMTP) nunca bloquee la respuesta HTTP principal.
  email-worker:
    profiles: [real]
    build:
      context: ./backend
    container_name: masssend-email-worker
    command: ["python", "-m", "masssend.interfaces.workers.tareas_correo"]
    env_file:
      - ./backend/.env
    environment:
      WHATSAPP_API_URL: "http://whatsapp:3001"
      OLLAMA_URL: "http://ollama:11434"
      POCKETBASE_URL: "http://pocketbase:8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-masssend_user}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en backend/.env y usa --env-file backend/.env}@postgres:5432/${POSTGRES_DB:-masssend_db}"
      DB_SSL_REQUIRE: "False"
      DEBUG: "False"
      REDIS_URL: "redis://redis:6379/0"
      <<: *adaptadores-reales
    volumes:
      - ./backend/media:/app/media
    depends_on:
      - backend
      - postgres
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Servicio WhatsApp (Node + Baileys, genera el QR) ──────────────
  whatsapp:
    profiles: [real]
    build:
      context: ./backend/whatsapp_api
    container_name: masssend-whatsapp
    environment:
      PORT: "3001"
      DJANGO_API_URL: "http://backend:8000"
      WHATSAPP_WEBHOOK_TOKEN: "${WHATSAPP_WEBHOOK_TOKEN:?Define WHATSAPP_WEBHOOK_TOKEN en backend/.env y usa --env-file backend/.env}"
    volumes:
      # La sesión de WhatsApp se conserva entre reinicios (no re-escanear QR)
      - ./backend/whatsapp_api/auth_info_baileys:/app/auth_info_baileys
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Modelo de IA local (asistente del sistema) ────────────────────
  ollama:
    profiles: [real]
    image: ollama/ollama:latest
    container_name: masssend-ollama
    volumes:
      - masssend_ollama_models:/root/.ollama
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Almacenamiento de fotos/videos de campañas ────────────────────
  pocketbase:
    profiles: [real]
    build:
      context: ./infra/pocketbase
      args:
        PB_VERSION: "0.39.8"
    container_name: masssend-pocketbase
    environment:
      PB_SUPERUSER_EMAIL: "${PB_SUPERUSER_EMAIL:?Define PB_SUPERUSER_EMAIL en backend/.env y usa --env-file backend/.env}"
      PB_SUPERUSER_PASSWORD: "${PB_SUPERUSER_PASSWORD:?Define PB_SUPERUSER_PASSWORD en backend/.env y usa --env-file backend/.env}"
    volumes:
      - masssend_pocketbase_data:/pb/pb_data
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Base de datos PostgreSQL ──────────────────────────────────────
  postgres:
    profiles: [real]
    image: postgres:15-alpine
    container_name: masssend-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-masssend_db}"
      POSTGRES_USER: "${POSTGRES_USER:-masssend_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en backend/.env y usa --env-file backend/.env}"
    volumes:
      - masssend_postgres_data:/var/lib/postgresql/data
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Redis: cache de los limites de peticiones y cola de envíos ───
  redis:
    image: redis:7.4-alpine
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Perfil ci: API con adaptadores falsos ─────────────────────────
  backend-ci:
    <<: *backend-ci
    profiles: [ci]
    environment:
      <<: *entorno-ci
      DJANGO_SUPERUSER_USERNAME: staff@prueba.local
      DJANGO_SUPERUSER_EMAIL: staff@prueba.local
      DJANGO_SUPERUSER_PASSWORD: clave-larga-123
    # Crea la cuenta staff que usa la coleccion 05; existe solo en este perfil.
    command:
      - sh
      - -c
      - >-
        until python manage.py migrate --noinput; do sleep 1; done;
        python manage.py createsuperuser --noinput || true;
        exec /entrypoint.sh
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/salud', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 40
    depends_on:
      - postgres-ci
      - redis
      - mailpit

  email-worker-ci:
    <<: *backend-ci
    profiles: [ci]
    command: ["python", "-m", "masssend.interfaces.workers.tareas_correo"]
    depends_on:
      - backend-ci

  # Datos en memoria: desaparecen al apagar y no tocan los datos reales.
  postgres-ci:
    profiles: [ci]
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: masssend_ci
      POSTGRES_USER: masssend_ci
      POSTGRES_PASSWORD: solo-pruebas
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - masssend_network
    restart: unless-stopped

  # Solo si se pide con GENERADOR_TEXTO_CI=ollama --profile ia.
  ollama-ci:
    profiles: [ia]
    image: ollama/ollama:latest
    volumes:
      - masssend_ollama_models:/root/.ollama
    networks:
      - masssend_network
    restart: unless-stopped

  # Captura los correos; Postman lee los códigos desde su API.
  mailpit:
    profiles: [ci]
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - masssend_network
    restart: unless-stopped

networks:
  masssend_network:
    driver: bridge

volumes:
  masssend_ollama_models:
  masssend_pocketbase_data:
  masssend_postgres_data:
