# MassSend — arquitectura distribuida completa en Docker Compose.
# Servicios independientes (NO monolito): cada uno con su imagen,
# su contenedor y comunicación por la red interna `masssend_network`.
#
#   navegador ─→ frontend (React + Nginx:5173) ─→ backend (Django:8000)
#   Postman ─→ backend (Django:8000)
#   backend ─→ whatsapp (Node:3001), ollama (11434), pocketbase (8080)
#   whatsapp ─→ backend (webhooks autenticados) y pocketbase (archivos)
#   en el host se publican el frontend, el backend y Mailpit
#
# Perfiles:
#   real  sistema completo, con WhatsApp, Ollama, PocketBase y datos persistentes.
#   ci    API con adaptadores falsos y datos temporales, para Postman.
#
# El perfil real no necesita backend/.env: levantar.sh genera los secretos
# internos en backend/.env.secretos y suma los archivos de cada servicio
# (backend/.env.gmail, .env.google, .env.paypal, .env.payphone, .env.ia) con
# --env-file. Sin .env.gmail los correos quedan en Mailpit; sin las claves de
# Google o de una pasarela, esa funcion responde "no configurado" (nunca se simula).
x-entorno-real: &entorno-real
  SECRET_KEY: "${SECRET_KEY:?Falta SECRET_KEY: ejecuta ./levantar.sh, que la genera}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY: ejecuta ./levantar.sh, que la genera}"
  WHATSAPP_WEBHOOK_TOKEN: "${WHATSAPP_WEBHOOK_TOKEN:?Falta WHATSAPP_WEBHOOK_TOKEN: ejecuta ./levantar.sh}"
  # Dentro de la red Docker los servicios se llaman por su nombre
  WHATSAPP_API_URL: "http://whatsapp:3001"
  OLLAMA_URL: "http://ollama:11434"
  OLLAMA_MODEL: "${OLLAMA_MODEL_CI:-qwen2.5:0.5b}"
  POCKETBASE_URL: "http://pocketbase:8080"
  POCKETBASE_PUBLIC_URL: "http://pocketbase:8080"
  POCKETBASE_ADMIN_EMAIL: "${PB_SUPERUSER_EMAIL:?Falta PB_SUPERUSER_EMAIL: ejecuta ./levantar.sh}"
  POCKETBASE_ADMIN_PASSWORD: "${PB_SUPERUSER_PASSWORD:?Falta PB_SUPERUSER_PASSWORD: ejecuta ./levantar.sh}"
  DATABASE_URL: "postgres://${POSTGRES_USER:-masssend_user}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD: ejecuta ./levantar.sh}@postgres:5432/${POSTGRES_DB:-masssend_db}"
  DB_SSL_REQUIRE: "False"
  DEBUG: "False"
  REDIS_URL: "redis://redis:6379/0"
  CANAL_MENSAJERIA: whatsapp
  COLA_ENVIOS: celery
  ALMACEN_ARCHIVOS: pocketbase
  GENERADOR_TEXTO: ollama
  # Pagos y Google siempre reales: sin credenciales responden "no configurado".
  PASARELA_PAGO_FAKE: "0"
  PROVEEDOR_GOOGLE: google
  # Con backend/.env.gmail salen por Gmail; si no, se quedan en Mailpit.
  DESTINO_CORREO: "${DESTINO_CORREO_CI:-mailpit}"
  EMAIL_USER: "${EMAIL_USER:-}"
  EMAIL_APP_PASSWORD: "${EMAIL_APP_PASSWORD:-}"
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
  GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
  GOOGLE_RETORNO_V1: "${GOOGLE_RETORNO_V1:-}"
  PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
  PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
  PAYPAL_BASE_URL: "${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}"
  PAYPHONE_TOKEN: "${PAYPHONE_TOKEN:-}"
  PAYPHONE_STORE_ID: "${PAYPHONE_STORE_ID:-}"
  PAYPHONE_BASE_URL: "${PAYPHONE_BASE_URL:-https://pay.payphonetodoesposible.com}"
  PAYPHONE_RETORNO_V1: "${PAYPHONE_RETORNO_V1:-}"

# backend/.env es opcional: sirve para ajustes extra (ALLOWED_HOSTS, FRONTEND_URL...).
x-env-opcional: &env-opcional
  - path: ./backend/.env
    required: false

x-backend-ci: &backend-ci
  build:
    context: ./backend
  environment: &entorno-ci
    SECRET_KEY: "${SECRET_KEY:?Define SECRET_KEY en el archivo de --env-file}"
    JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Define JWT_SECRET_KEY en el archivo de --env-file}"
    DATABASE_URL: "postgres://masssend_ci:solo-pruebas@postgres-ci:5432/masssend_ci"
    DB_SSL_REQUIRE: "False"
    DEBUG: "False"
    REDIS_URL: "redis://redis:6379/0"
    CANAL_MENSAJERIA: fake
    COLA_ENVIOS: sincrona
    ALMACEN_ARCHIVOS: memoria
    GENERADOR_TEXTO: "${GENERADOR_TEXTO_CI:-fake}"
    OLLAMA_URL: "http://ollama-ci:11434"
    OLLAMA_MODEL: "${OLLAMA_MODEL_CI:-qwen2.5:0.5b}"
    # Por defecto pagos simulados. backend/.env.paypal y backend/.env.payphone
    # activan cada pasarela real por separado.
    PASARELA_PAGO_FAKE: "${PASARELA_PAGO_FAKE_CI:-1}"
    PASARELA_PAYPAL: "${PASARELA_PAYPAL_CI:-auto}"
    PASARELA_PAYPHONE: "${PASARELA_PAYPHONE_CI:-auto}"
    PAYPHONE_TOKEN: "${PAYPHONE_TOKEN:-}"
    PAYPHONE_STORE_ID: "${PAYPHONE_STORE_ID:-}"
    PAYPHONE_BASE_URL: "${PAYPHONE_BASE_URL:-https://pay.payphonetodoesposible.com}"
    PAYPHONE_RETORNO_V1: "${PAYPHONE_RETORNO_V1:-}"
    PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
    PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
    PAYPAL_BASE_URL: "${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}"
    API_LIMITE_ASISTENTE: 100000/min
    # Por defecto Mailpit. Con backend/.env.gmail los correos salen por Gmail.
    DESTINO_CORREO: "${DESTINO_CORREO_CI:-mailpit}"
    EMAIL_USER: "${EMAIL_USER:-}"
    EMAIL_APP_PASSWORD: "${EMAIL_APP_PASSWORD:-}"
    # Por defecto Google falso. Con backend/.env.google se usa la cuenta real.
    PROVEEDOR_GOOGLE: "${PROVEEDOR_GOOGLE_CI:-fake}"
    GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
    GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    GOOGLE_RETORNO_V1: "${GOOGLE_RETORNO_V1:-}"
    FREE_SIGNUP_CREDITS: "10"
    API_LIMITE_ANONIMO: 100000/min
    API_LIMITE_USUARIO: 100000/min
    API_LIMITE_SENSIBLE: 100000/min
    EMAIL_QUEUE_INTERVAL_MS: "200"
    WHATSAPP_WEBHOOK_TOKEN: "${WHATSAPP_WEBHOOK_TOKEN:-solo-pruebas}"
  networks:
    - masssend_network
  restart: unless-stopped

services:

  # ── Backend Django (API, autenticación, campañas, pagos) ──────────
  backend:
    profiles: [real]
    build:
      context: ./backend
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: *env-opcional
    environment:
      <<: *entorno-real
      # Administrador inicial; levantar.sh lo crea con la clave de backend/.env.secretos.
      DJANGO_SUPERUSER_USERNAME: "${ADMIN_EMAIL:-admin@masssend.local}"
      DJANGO_SUPERUSER_EMAIL: "${ADMIN_EMAIL:-admin@masssend.local}"
      DJANGO_SUPERUSER_PASSWORD: "${ADMIN_PASSWORD:-}"
    # Sano cuando ya migro y responde; los workers esperan esto para no ver tablas faltantes.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client as h; c=h.HTTPConnection('localhost',8000,timeout=3); c.request('GET','/api/v1/salud'); exit(0 if c.getresponse().status<500 else 1)"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s
    volumes:
      - ./backend/media:/app/media
    depends_on:
      - pocketbase
      - ollama
      - postgres
      - redis
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Worker: consumidor de la cola de correos (asíncrono) ───────────
  # Mismo código e imagen que "backend", pero corre otro comando:
  # en vez de servir HTTP, se queda en bucle revisando EmailTask
  # (PENDING -> PROCESSING -> SENT/FAILED). Es un servicio aparte para
  # que un correo lento (SMTP) nunca bloquee la respuesta HTTP principal.
  email-worker:
    profiles: [real]
    build:
      context: ./backend
    command: ["python", "-m", "masssend.interfaces.workers.tareas_correo"]
    env_file: *env-opcional
    environment: *entorno-real
    volumes:
      - ./backend/media:/app/media
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - masssend_network
    restart: unless-stopped

  # Igual que email-worker, pero toma los envios de campana vencidos y
  # los manda a WhatsApp respetando el ritmo. Reemplaza al hilo del panel.
  envio-worker:
    profiles: [real]
    build:
      context: ./backend
    command: ["python", "-m", "masssend.interfaces.workers.tareas_envio"]
    env_file: *env-opcional
    environment: *entorno-real
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Servicio WhatsApp (Node + Baileys, genera el QR) ──────────────
  whatsapp:
    profiles: [real]
    build:
      context: ./backend/whatsapp_api
    environment:
      PORT: "3001"
      DJANGO_API_URL: "http://backend:8000"
      WHATSAPP_WEBHOOK_TOKEN: "${WHATSAPP_WEBHOOK_TOKEN:?Falta WHATSAPP_WEBHOOK_TOKEN: ejecuta ./levantar.sh}"
    volumes:
      # La sesión de WhatsApp se conserva entre reinicios (no re-escanear QR)
      - ./backend/whatsapp_api/auth_info_baileys:/app/auth_info_baileys
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Modelo de IA local (asistente del sistema) ────────────────────
  ollama:
    profiles: [real]
    image: ollama/ollama:latest
    volumes:
      - masssend_ollama_models:/root/.ollama
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Almacenamiento de fotos/videos de campañas ────────────────────
  pocketbase:
    profiles: [real]
    build:
      context: ./infra/pocketbase
      args:
        PB_VERSION: "0.39.8"
    environment:
      PB_SUPERUSER_EMAIL: "${PB_SUPERUSER_EMAIL:?Falta PB_SUPERUSER_EMAIL: ejecuta ./levantar.sh}"
      PB_SUPERUSER_PASSWORD: "${PB_SUPERUSER_PASSWORD:?Falta PB_SUPERUSER_PASSWORD: ejecuta ./levantar.sh}"
    volumes:
      - masssend_pocketbase_data:/pb/pb_data
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Base de datos PostgreSQL ──────────────────────────────────────
  postgres:
    profiles: [real]
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-masssend_db}"
      POSTGRES_USER: "${POSTGRES_USER:-masssend_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD: ejecuta ./levantar.sh}"
    volumes:
      - masssend_postgres_data:/var/lib/postgresql/data
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Redis: cache de los limites de peticiones y cola de envíos ───
  redis:
    image: redis:7.4-alpine
    networks:
      - masssend_network
    restart: unless-stopped

  # ── Perfil ci: API con adaptadores falsos ─────────────────────────
  backend-ci:
    <<: *backend-ci
    profiles: [ci]
    environment:
      <<: *entorno-ci
      DJANGO_SUPERUSER_USERNAME: staff@prueba.local
      DJANGO_SUPERUSER_EMAIL: staff@prueba.local
      DJANGO_SUPERUSER_PASSWORD: clave-larga-123
    # Crea la cuenta staff que usa la coleccion 05; existe solo en este perfil.
    command:
      - sh
      - -c
      - >-
        until python manage.py migrate --noinput; do sleep 1; done;
        python manage.py createsuperuser --noinput || true;
        exec /entrypoint.sh
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/salud', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 40
    depends_on:
      - postgres-ci
      - redis
      - mailpit

  email-worker-ci:
    <<: *backend-ci
    profiles: [ci]
    command: ["python", "-m", "masssend.interfaces.workers.tareas_correo"]
    depends_on:
      - backend-ci

  # Datos en memoria: desaparecen al apagar y no tocan los datos reales.
  postgres-ci:
    profiles: [ci]
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: masssend_ci
      POSTGRES_USER: masssend_ci
      POSTGRES_PASSWORD: solo-pruebas
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - masssend_network
    restart: unless-stopped

  # Solo si se pide con GENERADOR_TEXTO_CI=ollama --profile ia.
  ollama-ci:
    profiles: [ia]
    image: ollama/ollama:latest
    volumes:
      - masssend_ollama_models:/root/.ollama
    networks:
      - masssend_network
    restart: unless-stopped

  # Captura los correos; Postman lee los códigos desde su API. En real recibe
  # los correos mientras no exista backend/.env.gmail.
  mailpit:
    profiles: [ci, real]
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - masssend_network
    restart: unless-stopped

  # Frontend React: sirve la aplicacion y reenvia /api al backend. Esta en el
  # dominio registrado en PayPhone (localhost:5173), que solo abre su formulario
  # si el navegador llega desde ahi.
  frontend:
    profiles: [real]
    build:
      context: ./frontend
    environment:
      API_DESTINO: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - masssend_network
    restart: unless-stopped

  frontend-ci:
    profiles: [ci]
    build:
      context: ./frontend
    environment:
      API_DESTINO: http://backend-ci:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend-ci
    networks:
      - masssend_network
    restart: unless-stopped

networks:
  masssend_network:
    driver: bridge

volumes:
  masssend_ollama_models:
  masssend_pocketbase_data:
  masssend_postgres_data:
