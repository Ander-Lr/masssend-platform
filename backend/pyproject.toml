[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"

# El contrato de arquitectura: si alguno se rompe, make arch falla.
[tool.importlinter]
root_packages = ["masssend"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Las capas solo dependen hacia adentro"
type = "layers"
layers = [
    "masssend.interfaces",
    "masssend.infrastructure",
    "masssend.application",
    "masssend.domain",
]

[[tool.importlinter.contracts]]
name = "El nucleo no depende de frameworks ni del legacy"
type = "forbidden"
source_modules = ["masssend.domain", "masssend.application"]
forbidden_modules = [
    "django",
    "rest_framework",
    "requests",
    "httpx",
    "redis",
    "celery",
    "pika",
    "channels",
    "pyotp",
    "jwt",
    "google",
    "cryptography",
    "mass_sender",
    "email_auth",
    "billing",
    "core",
]

[[tool.importlinter.contracts]]
name = "Los modulos del dominio son independientes"
type = "independence"
modules = [
    "masssend.domain.identidad",
    "masssend.domain.creditos",
    "masssend.domain.ia",
    "masssend.domain.campanas",
    "masssend.domain.envio",
]

[[tool.importlinter.contracts]]
name = "Los modulos de aplicacion son independientes"
type = "independence"
modules = [
    "masssend.application.identidad",
    "masssend.application.creditos",
    "masssend.application.ia",
    "masssend.application.campanas",
    "masssend.application.envio",
]
